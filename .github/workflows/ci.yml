name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run checks
        run: pnpm check
      - name: Build and smoke-test standalone CLI archive
        run: pnpm release:build
      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: repopilot-cli-${{ github.sha }}
          path: release-artifacts/repopilot-*
